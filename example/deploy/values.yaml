# generated by wilanis-deploy from example (profile production) -- do not edit
# regenerate: npx wilanis-deploy example --profile production --target helm
name: "customers"
image:
  repository: "customers"
  tag: "0.1.0"
  pullPolicy: "IfNotPresent"
workloads:
  - profile: "production"
    command: ["wilanis", "start", ".", "--profile", "production"]
    replicas: 1 # RFC 0005 is what makes a second safe: until then this tree may hold state on disk
    ports: [{name: "tcp-8099", port: 8099}]
    probe: {tcpSocket: {port: 8099}}
    env:
      - {name: "CUSTOMERS_DATABASE_URL", secretKey: "CUSTOMERS_DATABASE_URL"}
      - {name: "CUSTOMERS_JWT_SECRET", secretKey: "CUSTOMERS_JWT_SECRET"}
      - {name: "CUSTOMERS_OPERATOR_PASSWORD_HASH", secretKey: "CUSTOMERS_OPERATOR_PASSWORD_HASH"}
secret:
  existingSecret: "" # the Secret the operator creates, named after the tree where this is empty; these values never hold one
  keys: ["CUSTOMERS_DATABASE_URL", "CUSTOMERS_JWT_SECRET", "CUSTOMERS_OPERATOR_PASSWORD_HASH"]
# What the environment must provide: every connection a workload reaches whose kind declares an endpoint.
# No template reads it. NOTES.txt prints it after an install, and says it is a floor.
requires: []
# What the chart may stand up beside the tree, each off: the switches exist so a demo stands up on a laptop,
# and a production connection names a host the operator runs (charts/wilanis-tree/README.md).
postgresql: {enabled: false}
minio: {enabled: false}
jaeger: {enabled: false}
