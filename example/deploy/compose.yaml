# generated by wilanis-deploy from example (profile production) -- do not edit
# regenerate: npx wilanis-deploy example --profile production
name: "customers"
services:
  customers-production:
    build:
      context: ".."
      dockerfile: "deploy/Dockerfile"
    image: "customers:0.1.0"
    command: ["wilanis", "start", ".", "--profile", "production"]
    ports: ["8099:8099"]
    env_file: [".env"]
    restart: "unless-stopped"
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(8099).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: "10s"
      timeout: "2s"
      retries: 6
