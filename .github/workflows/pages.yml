name: pages

# What wilanis.dev serves, with nothing running behind it: the example drawn by the viewer at /example/, the
# demo's page at /demo/, the arena's page at /arena/, and a landing page at the root (docs/site/index.html).
# `wilanis-view --static` writes the example's page and every answer it would otherwise ask a server for, so
# the site is files on a CDN: no tree is loaded, no document is run, and no path outside this repository is
# named. A document the viewer cannot draw, or a demo step that no longer plays, fails this job rather than
# the page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer main wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: write the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: the example, written out as files
        run: npx wilanis-view example --static _site/example
      - name: the demo, run and written only if every step passes
        # build.mjs plays the demo against a copy of the example and asserts each step's payoff; a demo that
        # no longer plays fails the deploy here rather than publishing a stale record.
        run: |
          node docs/demo/build.mjs
          mkdir -p _site/demo && cp docs/demo/index.html _site/demo/index.html
      - name: the arena, as last run by hand
        # the arena needs the claude CLI and an account, so it cannot run here; docs/demo/arena/run.sh refreshes it
        run: mkdir -p _site/arena && cp docs/demo/arena/index.html _site/arena/index.html
      - name: the domain, and the root
        run: |
          echo 'wilanis.dev' > _site/CNAME
          cp docs/site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
