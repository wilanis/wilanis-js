name: cluster

# The example on a local Kubernetes cluster and under docker compose (RFC 0024). In the `cluster` job the chart lints
# and renders on the example's generated values, then scripts/cluster.sh builds the example's image from the
# workspace's packages as `npm pack` writes them, installs charts/wilanis-tree on a kind cluster with values-local.yaml,
# and signs in and reads GET /customers through the NodePort for a 200, and the cluster is deleted. In the `compose` job
# the same script builds the same image through example/deploy/compose.yaml, brings it up beside a PostgreSQL, signs in
# and reads GET /customers on the port the Compose file publishes for a 200, and takes it down. It takes minutes and a
# container runtime, so it runs where the chart, the script, the example's deploy/ files or the tool that writes them
# changes, on main as on a pull request, and when dispatched. No branch rule requires it, and ci's `test` job keeps
# `wilanis-deploy --check` as the cheap guard that the files under example/deploy/ are current.

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - scripts/cluster.sh
      - packages/deploy/**
      - example/deploy/**
      - .github/workflows/cluster.yml
  pull_request:
    paths:
      - charts/**
      - scripts/cluster.sh
      - packages/deploy/**
      - example/deploy/**
      - .github/workflows/cluster.yml
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request cancels the run it supersedes; a run of main is never cancelled, as in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cluster:
    name: the example on a kind cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # helm at ci.yml's pin, and kind and kubectl beside it, each pinned by version and by the checksum of what is
      # fetched, unpacked under the runner's temp and put on this job's PATH; nothing is installed system-wide. kubectl
      # is at the minor of the Kubernetes that kind's default node image runs, 1.37.
      - name: helm, kind and kubectl, pinned
        env:
          HELM_VERSION: v4.3.0
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          KUBECTL_VERSION: v1.37.1
          KUBECTL_SHA256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$bin" --strip-components=1 linux-amd64/helm
          curl -fsSL -o "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $bin/kind" | sha256sum -c -
          curl -fsSL -o "$bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  $bin/kubectl" | sha256sum -c -
          chmod +x "$bin/kind" "$bin/kubectl"
          echo "$bin" >> "$GITHUB_PATH"
      - name: the script passes shellcheck
        run: shellcheck scripts/cluster.sh
      # The same lint and render ci.yml's test job runs, here so a chart that does not render fails before a cluster
      # is made. The dependencies are fetched as Chart.lock pins them, which needs each repository it names added first.
      - name: the chart lints and renders the example's values
        run: |
          grep -o 'https://[^ ]*' charts/wilanis-tree/Chart.lock | sort -u | nl -w1 -s' ' \
            | while read -r n url; do helm repo add "pinned-$n" "$url"; done
          helm dependency build charts/wilanis-tree
          helm lint --strict charts/wilanis-tree -f example/deploy/values.yaml -f charts/wilanis-tree/values-local.yaml
          helm template customers charts/wilanis-tree -f example/deploy/values.yaml \
            -f charts/wilanis-tree/values-local.yaml > /dev/null
      # `up` ends with `scripts/cluster.sh smoke`: the operator signs in at POST /api/v1/auth-employees and GET /customers
      # answers 200 with the token, through localhost:8080 and the node's 30080, so the run fails unless the example,
      # built from the packed tarballs and installed from the chart, answers a route.
      - name: the example stands up on kind, and a signed-in GET /customers answers 200
        run: scripts/cluster.sh up
      - name: what the cluster holds, where a step failed
        if: failure()
        run: |
          kubectl --context kind-wilanis get all,secrets,pvc -A -o wide || true
          kubectl --context kind-wilanis get clusters.postgresql.cnpg.io -A -o wide || true
          kubectl --context kind-wilanis describe pods || true
          kubectl --context kind-wilanis logs deployment/customers-production --all-containers --tail=200 || true
          kubectl --context kind-wilanis logs deployment/customers-cloudnative-pg --tail=100 || true
          kubectl --context kind-wilanis get events -A --sort-by=.lastTimestamp || true
      - name: the cluster is deleted
        if: always()
        run: scripts/cluster.sh down

  compose:
    name: the example under docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `compose` builds the image as `up` does, from the packed tarballs, but through compose.yaml's own build; fills
      # deploy/.env with values-local.yaml's demo values and the URL of the PostgreSQL an override stands up beside the
      # tree, the generated compose.yaml left as it is; waits for both healthchecks; signs in and reads GET /customers on
      # localhost:8099, the port compose.yaml publishes, for a 200; and ends with `docker compose down -v`, which it runs
      # after printing the services' logs where a step before it fails. docker and its compose plugin are the runner's.
      - name: the example comes up under docker compose, and a signed-in GET /customers answers 200
        run: |
          docker compose version
          scripts/cluster.sh compose
