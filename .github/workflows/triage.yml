name: triage

# The monthly backlog triage: on the first of the month, one issue labelled `triage` lists what the board
# cannot settle by itself -- what lacks a type or an area, what has gone quiet for 30 or 60 days, claims with
# no pull request, ready issues still blocked, RFCs whose steps have all closed, closed issues not Done, and
# milestones with nothing open or past due. The previous month's triage issue is closed in its favour.
on:
  schedule:
    - cron: "7 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      # Until the secret exists the job says so and skips, rather than failing every event it runs on.
      - name: the token is there
        id: token
        run: |
          if [ -n "$GH_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::the PROJECT_TOKEN secret is not set, so the board is not synced: see .github/board/README.md"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.set == 'true'
        with:
          sparse-checkout: .github/board
      - uses: actions/setup-node@v4
        if: steps.token.outputs.set == 'true'
        with:
          node-version: 24
      - if: steps.token.outputs.set == 'true'
        run: node .github/board/triage.mjs
