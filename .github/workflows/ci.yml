name: ci

on:
  push:
    branches: [main]
  pull_request:
  # main's merge queue: a pull request merges once the queue's merge of it onto main passes the required checks,
  # so no branch is rebased and run again by hand each time another merges.
  merge_group:

# A push to a pull request cancels the run it supersedes. A push to main and a merge group are never cancelled,
# so neither shares a group with another run: GitHub keeps one pending run per group and cancels the older one
# even without cancel-in-progress, and a group keyed on main's ref alone would drop a run of main whenever
# merges land faster than one run takes. A merge group's ref already names one group; the sha keeps main's apart.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips on a merge group, as `changes` and `decision` do: the pull request in it was held to them already, and
  # GitHub counts a skipped required check as satisfied.
  branch-name:
    name: branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The branch name and the author's login are the pull request's own text, so they reach each script as a
      # variable: an expression written into `run:` is pasted in before the shell reads it, and a name holding
      # `$(`, a backtick or `;` would run before the first step could refuse it.
      - name: the head branch names the issue it serves
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          b="$HEAD_REF"
          echo "$b" | grep -Eq '^[0-9]+-[a-z0-9-]+$' && echo "ok: $b" || { echo "branch '$b' must be <issue>-<short-title>, e.g. 4-storage-plugin"; exit 1; }

      - name: the issue it names is claimed by its author, and by no one else
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          n="$HEAD_REF"; n="${n%%-*}"
          author="$AUTHOR"
          holders=$(gh api "repos/${{ github.repository }}/issues/$n" --jq '[.assignees[].login] | join(" ")' 2>/dev/null) || {
            echo "issue #$n does not exist: name the branch after the issue it serves"; exit 1; }
          others=$(gh pr list -R "${{ github.repository }}" --state open --search "$n in:title,body" \
            --json number,headRefName,author \
            --jq "[.[] | select(.headRefName | startswith(\"$n-\")) | select(.number != ${{ github.event.pull_request.number }}) | \"#\(.number) by \(.author.login)\"] | join(\", \")")
          [ -n "$others" ] && { echo "issue #$n is already served by $others: one author per task"; exit 1; }
          case " $holders " in
            *" $author "*) echo "ok: #$n claimed by $author" ;;
            "  ") echo "issue #$n has no assignee: claim it with 'gh issue edit $n --add-assignee @me'"; exit 1 ;;
            *) echo "issue #$n is assigned to $holders, not $author: one author per task"; exit 1 ;;
          esac

  test:
    name: lint, build, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    # CI starts no vendor service: the suites that need a database or an object store skip here, as they do
    # anywhere their variable is unset, and are run locally (the Postgres and MySQL engines' and the S3 plugin's
    # READMEs)
    steps:
      - uses: actions/checkout@v4
      # Whether a test reads anything the change touches. A pull request or a merge group whose every file is on
      # UNREAD skips the rest of this job, which still reports success: a required check that never reports
      # blocks the merge. UNREAD is read off the suite, not guessed: every test/ directory, fitness/, each
      # package's src/, vitest.config.ts, biome.jsonc, the tsconfigs, the package.json scripts and docs/demo/lib
      # (which the demo's tests import) were searched for the paths they open or walk, and what is left is prose
      # and static files none of them names. README.md, docs/demo.md, docs/demo/ outside its arena, docs/refusals/
      # and packages/runtime/templates/ are read, so they are not on it. A path goes on it only once no test and no
      # fitness function reads it, and comes off the day one does. A push to main, and a change whose files
      # cannot be listed, run in full; `fitness` always runs in full.
      # It also hands on `base`, the revision a plugin's tests are chosen against (vitest.config.ts): the pull
      # request's base, the queue's, or for a push the previous tip of main (`github.event.before`), fetched here
      # so `git diff` reaches it. A push whose `before` is all zeros hands on none, nor does a base that cannot
      # be fetched; the step says why, and then every plugin's tests run.
      - id: reads
        name: whether a test reads what the change touches
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          # one extended regular expression per line, matched against the whole repository-relative path; a
          # rename is listed under both its names, so moving a file a test reads onto this list still runs in full
          UNREAD: |
            docs/rfcs/.+
            docs/(roadmap|model|compared|security-model)\.md
            docs/atomic-sequence\.png
            docs/site/.+
            docs/demo/arena/.+
            (packages|libraries)/[^/]+/(README\.md|LICENSE)
            reserved/.+
            fitness/README\.md
            \.claude/skills/.+
            \.github/ISSUE_TEMPLATE/.+
            \.github/PULL_REQUEST_TEMPLATE\.md
            \.github/board/README\.md
            (CLAUDE|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\.md
            LICENSE
        run: |
          full() { echo "runs in full: $1"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; }
          base=""; fetched=""
          case "$EVENT" in pull_request) base="$PR_BASE" ;; merge_group) base="$BASE_SHA" ;; push) base="$PUSH_BEFORE" ;; esac
          if [ -z "$base" ]; then
            echo "hands on no base: a $EVENT names none, so every plugin's tests run"
          elif [ "$base" = 0000000000000000000000000000000000000000 ]; then
            echo "hands on no base: the $EVENT names no previous tip (all zeros), so every plugin's tests run"
          elif git fetch --no-tags --depth=1 origin "$base"; then
            fetched=yes; echo "base=$base" >> "$GITHUB_OUTPUT"; echo "hands on the base $base"
          else
            echo "hands on no base: $base could not be fetched, so every plugin's tests run"
          fi
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PULL/files" \
                --jq '.[] | .filename, (.previous_filename // empty)') \
                || full "the pull request's files could not be listed"
              [ "$(printf '%s\n' "$files" | grep -c .)" -ge "$CHANGED" ] \
                || full "the pull request changes $CHANGED files and only some were listed" ;;
            merge_group)
              [ -n "$fetched" ] || full "the merge group's base could not be fetched"
              files=$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA") \
                || full "the merge group's files could not be listed" ;;
            *) full "a $EVENT is always tested whole" ;;
          esac
          [ -n "$files" ] || full "no changed file was listed"
          printf '%s\n' "$UNREAD" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/unread"
          listed=$(printf '%s\n' "$files" | grep -Evxf "$RUNNER_TEMP/unread" || true)
          if [ -n "$listed" ]; then
            echo "runs in full: a test may read these, which are not on UNREAD"
            printf '%s\n' "$listed" | head -5 | sed 's/^/  /'
            more=$(( $(printf '%s\n' "$listed" | grep -c .) - 5 ))
            [ "$more" -le 0 ] || echo "  and $more more"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skips the build and the tests: no test reads a file this change touches"
          printf '%s\n' "$files" | sed 's/^/  /'
          echo "skip=true" >> "$GITHUB_OUTPUT"
      - if: steps.reads.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: steps.reads.outputs.skip != 'true'
        run: npm ci
      # npm test runs the tests under packages/plugin-*/test only for a plugin whose directory differs from the
      # base `reads` handed on; vitest.config.ts chooses them and says on its first lines which ran and which did
      # not. With no base (the `reads` step says why), npm run test:all runs every plugin's tests.
      - if: steps.reads.outputs.skip != 'true'
        name: npm test, with the tests of the plugins the change touches
        env:
          WILANIS_TEST_BASE: ${{ steps.reads.outputs.base }}
        run: |
          if [ -n "$WILANIS_TEST_BASE" ]; then npm test; else npm run test:all; fi
      - name: the example checks and rehearses, under each of its profiles
        if: steps.reads.outputs.skip != 'true'
        run: |
          npx wilanis check example
          npx wilanis check libraries/access
          npx wilanis rehearse example --profile local
          npx wilanis rehearse example --profile live
          npx wilanis rehearse example --profile production
          npx wilanis rehearse example --profile production-scheduler
          npx wilanis rehearse example --profile production-worker
        env:
          CUSTOMERS_JWT_SECRET: ci-only-not-a-secret
          CUSTOMERS_DATABASE_URL: postgres://postgres:wilanis@127.0.0.1:5432/customers
      # example/scenarios/rehearsed/ and example/scenarios/edges/ are what rehearse --record and fuzz --edges write,
      # checked in (RFC 0018). --check writes nothing, and fails when a file there has gone stale against the tree or
      # the rehearsal itself fails; it solves under the default profile alone, so no profile is named here.
      - name: the example's scenarios are what the tree writes
        if: steps.reads.outputs.skip != 'true'
        run: npx wilanis scenarios example --check
      # example/deploy/ is what wilanis-deploy writes for production, checked in (RFC 0024). --check writes nothing
      # and fails when a file there has gone stale against the tree; it needs no container runtime and no cluster.
      - name: the example's deployment files are what the tree renders
        if: steps.reads.outputs.skip != 'true'
        run: npx wilanis-deploy example --profile production --target image,compose,helm --check
      # helm, pinned by version and by the checksum of its release archive, unpacked under the runner's temp and put
      # on this job's PATH; nothing is installed system-wide.
      - name: helm, pinned
        if: steps.reads.outputs.skip != 'true'
        env:
          HELM_VERSION: v4.3.0
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        run: |
          archive="$RUNNER_TEMP/helm-$HELM_VERSION-linux-amd64.tar.gz"
          curl -fsSL -o "$archive" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf "$archive" -C "$RUNNER_TEMP/helm" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"
      # The subcharts Chart.lock pins, kept between runs, so a chart host that fails for a minute fails no run that
      # already holds them. The key changes with Chart.yaml as well as the lock: a hit skips `helm dependency build`,
      # and with it helm's refusal of a lock out of step with Chart.yaml, so an edit to either misses and builds. The
      # action is pinned by commit, since a tag can be moved.
      - name: the chart's pinned subcharts, from the cache
        if: steps.reads.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/wilanis-tree/charts
          key: helm-subcharts-${{ hashFiles('charts/wilanis-tree/Chart.lock', 'charts/wilanis-tree/Chart.yaml') }}
      # charts/wilanis-tree is written by hand and its values by wilanis-deploy (RFC 0024): the chart lints on its own
      # values and on the example's, and renders the example's, alone, with the local demo's values, and with every
      # switch on and the operator's Cluster type known, so each pinned dependency renders too. scripts/subcharts.sh
      # leaves the dependencies the cache restored when they are every one Chart.lock pins, and otherwise fetches them
      # as the lock pins them, up to 3 times, failing with the host that did not answer.
      - name: the chart lints and renders the example's values
        if: steps.reads.outputs.skip != 'true'
        run: |
          scripts/subcharts.sh charts/wilanis-tree
          helm lint --strict charts/wilanis-tree
          helm lint --strict charts/wilanis-tree -f example/deploy/values.yaml
          helm lint --strict charts/wilanis-tree -f example/deploy/values.yaml -f charts/wilanis-tree/values-local.yaml
          helm template customers charts/wilanis-tree -f example/deploy/values.yaml
          helm template customers charts/wilanis-tree -f example/deploy/values.yaml \
            -f charts/wilanis-tree/values-local.yaml --api-versions postgresql.cnpg.io/v1/Cluster > /dev/null
          helm template customers charts/wilanis-tree -f example/deploy/values.yaml \
            --api-versions postgresql.cnpg.io/v1/Cluster \
            --set postgresql.enabled=true --set minio.enabled=true --set jaeger.enabled=true > /dev/null

  fitness:
    name: fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No build: a fitness function reads this repository's source as text, so it answers in seconds.
      - run: npm run fitness
      # The board sync's rules (.github/board): plain node, no dependencies, so it rides with the other quick job.
      - run: node --test .github/board/*.test.mjs

  # What the pull request touches, so `decision` can tell whether anything waits for the maintainer. A job
  # cannot read a diff in its own `if:`, so this one reads it and hands the answer on. A rename is listed under
  # both its names, so a decision renamed out of `*.fitness.ts` still waits; a listing that fails or comes up
  # short of the pull request's `changed_files` counts as gated, since a gate that cannot tell asks.
  changes:
    name: what the pull request touches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      gated: ${{ steps.files.outputs.gated }}
    steps:
      - id: files
        name: a decision or a schema, if the pull request changes one
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          ask() { echo "waits for the maintainer: $1"; echo "gated=true" >> "$GITHUB_OUTPUT"; exit 0; }
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)') \
            || ask "the pull request's files could not be listed"
          [ "$(printf '%s\n' "$files" | grep -c .)" -ge "$CHANGED" ] \
            || ask "the pull request changes $CHANGED files and only some were listed"
          gated=$(echo "$files" | grep -E '^(fitness/[^/]+\.fitness\.ts|packages/core/schemas/.+\.json)$' || true)
          if [ -n "$gated" ]; then
            echo "waits for the maintainer:"; echo "$gated" | sed 's/^/  /'
            echo "gated=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes no decision and no schema; nothing to approve"
            echo "gated=false" >> "$GITHUB_OUTPUT"
          fi

  # Waits in the `decisions` environment for the maintainer's approval, and runs only when there is something
  # to approve: a change of decision (RFC 0027) or of a schema, which `main` serves to every tree (RFC 0008).
  # GitHub counts a skipped required check as satisfied, while a job filtered out by `paths:` never reports at
  # all, so the job is always present and skips itself. When `changes` could not say, it runs: a gate that
  # cannot tell asks rather than waves through.
  decision:
    name: decision
    needs: changes
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.changes.outputs.gated != 'false' }}
    runs-on: ubuntu-latest
    environment: decisions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit that changes a decision says so
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$(git diff --name-only "$base" "$head" -- 'fitness/*.fitness.ts')" ]; then
            echo "this pull request changes no decision; the approval was for its schemas"
            exit 0
          fi
          missing=""
          for commit in $(git rev-list "$base".."$head"); do
            git diff-tree --no-commit-id --name-only -r "$commit" | grep -qE '^fitness/[^/]+\.fitness\.ts$' || continue
            git log -1 --format=%B "$commit" | grep -Eq '^Decision: (adds|reconfigures|retires) fitness/' \
              || missing="$missing $commit"
          done
          if [ -n "$missing" ]; then
            echo "refused: these commits change a decision and carry no Decision: line"
            for commit in $missing; do echo "  $(git log -1 --oneline "$commit")"; done
            echo
            echo "A commit that changes a decision says which of adds, reconfigures or retires, which file,"
            echo "and why. Rewrite the message (git rebase -i) and push again."
            exit 1
          fi
          echo "every commit changing a decision carries its Decision: line"
