<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wilanis view</title>
<style>
  :root {
    --bg: #0f1216; --panel: #151a21; --panel-2: #1b222b; --panel-3: #222b36; --line: #2a333f; --text: #d7dee8; --muted: #8b97a7; --dim: #5d6876;
    --accent: #6cb6ff; --ok: #7bd88f; --warn: #f0b350; --bad: #ff5370; --lit: #c3e88d; --type: #4ecdc4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); }
  a { color: var(--accent); text-decoration: none; cursor: pointer; } a:hover { text-decoration: underline; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); } button.on { border-color: var(--accent); color: var(--accent); }
  input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; outline: none; } input:focus { border-color: var(--accent); }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  #app { display: grid; grid-template-rows: 48px 1fr; grid-template-columns: 270px 1fr 340px; height: 100%; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { font-weight: 600; letter-spacing: .02em; color: var(--muted); margin-right: 6px; }
  header .crumb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
  header .title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  header .path { font-family: var(--mono); font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  header .status { color: var(--dim); font-size: 11px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); background: var(--panel-2); white-space: nowrap; vertical-align: middle; }
  .badge.kind-graph { color: var(--accent); } .badge.kind-trigger { color: var(--ok); } .badge.kind-policy { color: var(--ok); } .badge.kind-port { color: #c792ea; } .badge.kind-binding { color: var(--warn); } .badge.kind-shape { color: var(--type); }
  .badge.bad { color: var(--bad); border-color: var(--bad); } .badge.warn { color: var(--warn); } .badge.ok { color: var(--ok); }
  /* a scope is the store's word, not the node's: the badge opens the store that declares it */
  .badge.scope { color: var(--type); border-color: var(--type); text-decoration: none; }
  /* the one attachment a trigger could not drop: the policy a view it reaches is behind */
  .card .v small.req-view { font-family: var(--sans); color: var(--warn); white-space: normal; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside .filter { padding: 10px; border-bottom: 1px solid var(--line); }
  aside .list { overflow: auto; flex: 1; padding: 6px 0; }
  aside h4 { margin: 10px 12px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
  aside .doc { display: block; padding: 3px 12px 3px 18px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside .doc:hover { background: var(--panel-2); text-decoration: none; } aside .doc.active { background: #223042; color: #fff; }
  aside .doc small { color: var(--dim); font-family: var(--mono); font-size: 10px; margin-left: 6px; }
  main { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); }
  main svg.canvas { width: 100%; height: 100%; display: block; cursor: grab; } main svg.canvas.panning { cursor: grabbing; }
  main .grid { fill: url(#dots); }
  main .toolbar { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
  main .legend { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 14px; color: var(--dim); font-size: 11px; align-items: center; }
  main .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); margin-right: 4px; vertical-align: -1px; } main .legend i.full { background: var(--muted); }
  main .legend s { display: inline-block; width: 18px; border-top: 2px dashed var(--muted); vertical-align: 3px; margin-right: 4px; }
  main .legend u { display: inline-block; width: 11px; height: 8px; border: 1.5px dashed var(--ok); border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  main .empty { padding: 40px; color: var(--muted); }
  main .page { padding: 22px 28px 40px; overflow: auto; height: 100%; max-width: 1100px; }
  .page h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; } .page h1 .badge { margin-left: 10px; }
  .page .lead { color: var(--muted); margin: 0 0 6px; max-width: 80ch; } .page .file { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-bottom: 18px; }
  .page h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; margin: 24px 0 8px; }
  .page h3 { font-size: 14px; font-weight: 600; margin: 18px 0 4px; } .page h3 code { color: var(--dim); font-weight: 400; margin-left: 8px; }
  .page p { margin: 0 0 8px; color: var(--muted); max-width: 80ch; }
  .page table { border-collapse: collapse; width: 100%; margin: 4px 0 8px; } .page th { text-align: left; font-size: 11px; color: var(--dim); font-weight: 600; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); }
  .page td { padding: 5px 10px 5px 0; border-bottom: 1px solid #1d242d; vertical-align: top; } .page td.name { font-family: var(--mono); font-size: 12px; white-space: nowrap; } .page td.desc { color: var(--muted); }
  .page td.type { font-family: var(--mono); font-size: 12px; color: var(--type); white-space: nowrap; } .page td.val { font-family: var(--mono); font-size: 12px; color: var(--lit); overflow-wrap: anywhere; }
  .page .miss { color: var(--dim); font-style: italic; }
  .page .warn { color: var(--warn); }
  .was { text-decoration: line-through; color: var(--dim); }
  .page td.name .was { display: block; }
  .page td .until { display: block; font-family: var(--sans); font-size: 10px; color: var(--dim); white-space: normal; }
  .req::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 7px; vertical-align: 1px; }
  .opt::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--dim); box-sizing: border-box; margin-right: 7px; vertical-align: 1px; }
  .opt { color: var(--muted); } .opt::after { content: ' optional'; font-family: var(--sans); font-size: 10px; color: var(--dim); }
  .tag { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--panel-3); color: var(--muted); margin-left: 6px; vertical-align: 1px; } .tag.secret { color: var(--bad); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; } .card .k { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; } .card .v { font-size: 14px; margin-top: 2px; } .card .v small { display: block; color: var(--dim); font-family: var(--mono); font-size: 10px; margin-top: 3px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2); margin: 0 6px 6px 0; color: var(--text); } .chip:hover { border-color: var(--muted); text-decoration: none; }
  .chain { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 10px; } .chain .arrow { color: var(--dim); }
  .chain .step { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 130px; } .chain .step .k { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); } .chain .step .v { font-size: 13px; margin-top: 2px; }
  .source pre { font-family: var(--mono); font-size: 12px; line-height: 1.5; margin: 0; white-space: pre-wrap; } .source .k { color: var(--muted); } .source .s { color: var(--lit); } .source .n { color: #f78c6c; }
  .details { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 12px 14px; min-height: 0; }
  .details h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; } .details h4 { margin: 16px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
  .details p { margin: 0 0 8px; color: var(--muted); } .details .id { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  .details .row { display: grid; grid-template-columns: 110px 1fr; gap: 6px; padding: 3px 0; font-size: 12px; border-bottom: 1px solid #1d242d; }
  .details .row .name { font-family: var(--mono); } .details .row .type { color: var(--type); font-family: var(--mono); } .details .row .val { color: var(--lit); font-family: var(--mono); overflow-wrap: anywhere; } .details .row .miss { color: var(--dim); font-style: italic; }
  .details .row .from { color: var(--muted); font-family: var(--mono); } .details .row .from b { font-weight: 500; }
  .details .desc { color: var(--dim); font-size: 11px; padding: 0 0 4px; }
  .details .ref { display: block; padding: 4px 0; border-bottom: 1px solid #1d242d; } .details .ref .sub { display: block; color: var(--dim); font-size: 11px; font-family: var(--mono); } .details .ref .via { color: #c792ea; }
  .details .refusal { border-left: 3px solid var(--bad); padding: 4px 8px; margin: 6px 0; font-size: 12px; } .details .refusal code { color: var(--bad); } .details .refusal .hint { color: var(--muted); }
  .details .file { font-family: var(--mono); font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
  .details .primary { display: inline-block; margin: 6px 0; padding: 5px 12px; border-radius: 6px; background: #223042; color: #fff; } .details .primary:hover { text-decoration: none; background: #2a3b52; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
  /* nodes */
  .node .box { fill: var(--panel-2); stroke: var(--line); stroke-width: 1; rx: 8; }
  .node.selected .box { stroke: #fff; stroke-width: 1.5; }
  .node .head { fill: #202935; rx: 8; }
  .node .title { font: 600 12px var(--sans); fill: var(--text); }
  .node .sub { font: 11px var(--sans); fill: var(--muted); }
  .node .port { font: 11px var(--mono); fill: var(--text); } .node .port.opt { fill: var(--muted); } .node .port.type { fill: var(--dim); }
  .node .port.lit { fill: var(--lit); } .node .port.miss { fill: var(--dim); font-style: italic; }
  .node .pin { fill: var(--panel-2); stroke: var(--muted); stroke-width: 1.4; } .node .pin.req { fill: var(--muted); }
  .node .go { font: 14px var(--sans); fill: var(--accent); cursor: pointer; } .node .go:hover { fill: #fff; }
  .node .link { cursor: pointer; } .node .link:hover { fill: var(--accent); text-decoration: underline; }
  .node .fx { font: 10px var(--sans); fill: var(--warn); }
  /* a node whose effect is inside the graph's one transaction: a dashed rim and a word, so the set is seen at a glance */
  .node.joins > .box { stroke: var(--ok); stroke-dasharray: 4 3; }
  .node .txn { font: 10px var(--sans); fill: var(--ok); }
  /* a call site that is tried again or bounded (RFC 0011): its policy is a word on the node, the panel says it in full */
  .node .try { font: 10px var(--sans); fill: var(--type); }
  /* the rule a node is held to: a guard the compiler lowered names the invariant, a proved site says how, lighter */
  .node .inv { font: 10px var(--sans); cursor: pointer; }
  .node .inv .plate { stroke-width: 1; rx: 3; }
  .node .inv.guard .plate { fill: #3a2a1a; stroke: var(--warn); } .node .inv.guard text { fill: var(--warn); }
  .node .inv.held .plate { fill: #1a1f26; stroke: var(--dim); stroke-dasharray: 3 2; } .node .inv.held text { fill: var(--dim); }
  .node .inv:hover .plate { stroke: var(--accent); } .node .inv:hover text { fill: var(--accent); }
  .node .said { font: 12px var(--sans); fill: var(--text); } .node .said .lead { fill: var(--dim); } .node .said .val { font: 11.5px var(--mono); fill: var(--lit); }
  .node .said .in { font: 600 11.5px var(--mono); fill: var(--text); cursor: default; } .node .said .in:hover, .node .said .in.lit-up { fill: var(--accent); }
  .node .port.lit-up { fill: var(--accent); } .node .pin.lit-up { stroke: var(--accent); fill: var(--accent); }
  .group .box { fill: #12171d; stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 3; rx: 12; }
  .group .title { font: 600 12px var(--sans); fill: var(--muted); } .group .tag { font: 10px var(--sans); fill: var(--dim); letter-spacing: .06em; }
  .edge.step { stroke-dasharray: 3 3; } .elabel.step { font: italic 10px var(--sans); fill: var(--dim); }
  .edge { fill: none; stroke-width: 1.6; opacity: .9; } .edge.route { stroke-dasharray: 5 4; }
  .edge.dim { opacity: .12; } .edge.hot { stroke-width: 2.6; opacity: 1; }
  .elabel { font: 10px var(--mono); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">wilanis</span>
    <button id="back" title="back">&larr;</button>
    <button id="fwd" title="forward">&rarr;</button>
    <div class="crumb"><span id="kind" class="badge"></span><span id="title" class="title"></span><span id="role" class="badge" hidden></span><span id="atomic" class="badge ok" hidden></span><span id="refusals" class="badge bad" hidden></span><span id="path" class="path"></span></div>
    <button id="source" title="show the JSON document">{ } source</button>
    <span id="status" class="status"></span>
  </header>
  <aside>
    <div class="filter"><input id="filter" placeholder="find a document"></div>
    <div id="list" class="list"></div>
  </aside>
  <main id="main"></main>
  <div id="details" class="details"></div>
</div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const state = { index: null, view: null, selected: null, version: null, transform: { x: 40, y: 40, k: 1 }, current: null, fit: false, source: false };
  const ARROW = '↗', ELLIPSIS = '…', SEP = ' › ', TO = ' → ', FROM = '← ';
  /** How one conjunct was established at a site, in the words RFC 0007 asks a reader to be told. */
  const heldSaid = (h) => h.by === 'narrowed' ? "narrowed by '" + h.switch + "'" : h.by === 'through' ? "from '" + h.node + "'" : 'literal';
  /** How a whole rule was established: the ways its conjuncts were, each said once, in the order it writes them. */
  const heldWays = (held) => [...new Set(held.map(heldSaid))].join(', ');
  const KIND_NAMES = { project: 'Project', feature: 'Features', trigger: 'Triggers', policy: 'Policies', resolvers: 'Request reads', graph: 'Graphs', port: 'Ports', binding: 'Bindings', shape: 'Shapes', store: 'Stores', connection: 'Connections', scenario: 'Scenarios', plugin: 'Plugins', 'trigger-kind': 'Trigger kinds', 'connection-kind': 'Connection kinds', codec: 'Codecs' };
  const KIND_ONE = { project: 'project', feature: 'feature', trigger: 'trigger', policy: 'policy', resolvers: 'request reads', graph: 'graph', port: 'port', binding: 'binding', shape: 'shape', store: 'store', connection: 'connection', scenario: 'scenario', plugin: 'plugin', 'trigger-kind': 'trigger kind', 'connection-kind': 'connection kind', codec: 'codec' };
  /** A read path shown: request.headers['user-agent'] → request › headers › user-agent. */
  const showRead = (read) => String(read).split(/\.|\[['"]|['"]\]/).filter(Boolean).join(SEP);
  /** One scoped column said as a reader meets it: the column, and the read of the request that fills it. */
  const scopeSaid = c => c.column + ' ← {{' + c.read + '}}' + (c.from ? ' (request' + SEP + showRead(c.from).replace(/^request /, '') + ')' : '');
  const PALETTE = ['#6cb6ff', '#f0b350', '#7bd88f', '#c792ea', '#ff8a65', '#4ecdc4', '#f78c6c', '#82aaff', '#e57fb3', '#b5d66a', '#ffd166', '#64d3ff'];

  // ---- data --------------------------------------------------------------------------------------
  let STATIC = false;
  async function api(path) { const r = await fetch(STATIC ? staticFile(path) : path, { cache: 'no-store' }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || r.statusText || 'not found'), { body: j }); return j; }
  /** A reference made canonical: a project alias expanded (@shapes/X → @features/customers/shapes/X); anything else as written. */
  const canon = (ref) => { const m = /^(@[a-z][a-z0-9-]*)(\/.*)?$/.exec(String(ref)); if (!m || !state.index) return ref; const t = state.index.aliases[m[1]]; return t === undefined ? ref : t.replace(/\/$/, '') + (m[2] || ''); };
  /** The file a route is answered by when the tree was written out: no server, so no query strings. The index carries the version. */
  const staticFile = (path) => { const [route, query] = path.split('?'); const asked = query ? new URLSearchParams(query).get('path') || '' : ''; if (route === '/api/doc') return 'docs/' + String(canon(asked)).replace(/^@/, ''); if (route === '/api/schema') return 'schemas/' + asked; return 'index.json'; };
  const docAt = (path) => state.index && state.index.docs.find(d => d.path === canon(path));
  const isDocPath = (s) => !!docAt(s);
  const SCHEMA_REL = /^(?:node\/)?[a-z-]+\.schema\.json$/;
  /** The schema a string names, relative to core's schemas directory: from the alias (@wilanis/node/run.schema.json) or the published URL. */
  const schemaRelOf = (s) => { for (const prefix of ['@wilanis/', state.index ? state.index.schemaBase + '/' : null]) { if (prefix && String(s).startsWith(prefix) && SCHEMA_REL.test(String(s).slice(prefix.length))) return String(s).slice(prefix.length); } return null; };
  /** A $ref written inside a schema, resolved against the schema it sits in: ../common.schema.json from node/run.schema.json → common.schema.json. */
  const schemaRefOf = (ref, base) => { const file = String(ref).split('#')[0]; if (!base || !file || file.startsWith('@') || /^https?:/.test(file)) return null; const segs = base.split('/').slice(0, -1); for (const seg of file.split('/')) { if (seg === '..') segs.pop(); else if (seg !== '.') segs.push(seg); } const rel = segs.join('/'); return SCHEMA_REL.test(rel) ? rel : null; };
  const stem = (path) => String(path).replace(/^.*\//, '').replace(/\.json$/, '').replace(/\.[a-z-]+$/, '');
  const readable = (id) => { const w = String(id).replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/[-_]+/g, ' ').trim(); return w ? w[0].toUpperCase() + w.slice(1) : id; };
  /** The label of a document by path: its own, or its file name made readable. */
  const labelFor = (path) => { const d = docAt(path); return d ? d.label : readable(stem(path)); };
  /** A type reference shown with labels: a shape path becomes its label, [] kept. */
  const showType = (t) => t == null ? '' : String(t).startsWith('{') ? 'an object' + (String(t).endsWith('[]') ? ' list' : '') : String(t).replace(/@[\w./-]*?\.json/g, (m) => labelFor(m));
  /** An operation reference shown as "Port label › operation". */
  const showOp = (op) => { if (!op) return ''; const i = op.lastIndexOf('#'); return i < 0 ? labelFor(op) : labelFor(op.slice(0, i)) + SEP + op.slice(i + 1); };
  /** A literal shown: a string that is a document path becomes its label. */
  const showLit = (p) => { if (p.literal == null) return ''; if (p.ref) { const m = /((?:\[\])*)"?$/.exec(p.literal); return labelFor(p.ref) + (m ? m[1] : ''); } return p.literal; };

  // ---- routing --------------------------------------------------------------------------------------
  const go = (path) => { location.hash = '#' + path; };
  // #<path> opens a document; #<path>?node=<id> opens a graph with that node selected
  const currentPath = () => decodeURIComponent(location.hash.slice(1).split('?')[0]);
  const currentNode = () => { const q = location.hash.split('?')[1]; return q ? new URLSearchParams(q).get('node') : null; };
  window.addEventListener('hashchange', () => { void route(); });
  $('back').onclick = () => history.back();
  $('fwd').onclick = () => history.forward();
  $('source').onclick = () => { state.source = !state.source; $('source').classList.toggle('on', state.source); renderMain(); };

  async function route() {
    const path = currentPath();
    state.selected = currentNode();
    if (!path) {
      const first = state.index && (state.index.docs.find(d => d.kind === 'trigger') || state.index.docs[0]);
      if (first) { location.replace('#' + first.path); return; }
      renderAll(); return;
    }
    if (state.current === path && state.view && state.view.path === path) { renderAll(); return; }
    state.current = path;
    try { const rel = schemaRelOf(path); state.view = rel ? await api('/api/schema?path=' + encodeURIComponent(rel)) : await api('/api/doc?path=' + encodeURIComponent(path)); state.fit = true; }
    catch (e) { state.view = { error: e.message, path, refusals: (e.body && e.body.refusals) || [] }; }
    renderAll();
  }

  async function refresh(full) {
    try {
      const idx = await api('/api/index');
      const changed = idx.version !== state.version;
      state.version = idx.version; state.index = idx;
      if (changed && state.current && !schemaRelOf(state.current)) state.view = await api('/api/doc?path=' + encodeURIComponent(state.current)).catch(e => ({ error: e.message, path: state.current, refusals: [] }));
      if (full || changed) renderAll();
      $('status').textContent = idx.project ? `${idx.docs.length} documents` + (idx.refusals.length ? ` / ${idx.refusals.length} refusal(s)` : '') : '';
    } catch (e) { $('status').textContent = 'server unreachable'; }
  }
  /** While a server is behind the page, notice the tree changed and draw it again. A written-out tree never does. */
  const watch = () => setInterval(async () => { try { const v = await api('/api/version'); if (v.version !== state.version) await refresh(false); } catch { $('status').textContent = 'server unreachable'; } }, 1500);

  // ---- dom helpers ---------------------------------------------------------------------------------
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  /** A link that opens a graph with one node selected. */

  const badge = (kind, text) => el('span', 'badge kind-' + kind, text == null ? (KIND_ONE[kind] || kind) : text);

  // ---- sidebar --------------------------------------------------------------------------------------
  $('filter').oninput = renderList;

    const rank = (k) => { const i = order.findIndex(o => k.startsWith(KIND_NAMES[o])); return (i < 0 ? 99 : i) + (k.includes(' / ') ? 50 : 0); };
    const keys = [...groups.keys()].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));

  }

  // ---- render -------------------------------------------------------------------------------------
  function renderAll() { renderList(); renderHeader(); renderMain(); renderDetails(); }

  function renderHeader() {

  }

  function renderMain() {
    const main = $('main'); main.textContent = '';
    const v = state.view;

    if (v.error) { main.appendChild(el('div', 'empty', v.error)); return; }
    if (v.kind === 'schema') { renderSchemaPage(main, v); return; }
    if (state.source) { const page = el('div', 'page source'); const pre = el('pre'); renderJson(pre, v.doc); page.appendChild(pre); main.appendChild(page); return; }

  }

  /** Where a string in a JSON document leads: a document of the tree, a schema (a $schema or a node type), or a $ref inside the schema at `base`. */
  function hrefOf(raw, base) {
    const target = raw.split('#')[0].replace(/(\[\])+$/, '');
    if (target.startsWith('@') && isDocPath(target)) return '#' + canon(target);
    const rel = schemaRelOf(target) || schemaRefOf(raw, base);
    return rel ? '#@wilanis/' + rel : null;
  }
  /** JSON with every string that names a document or a schema turned into a link; `base` is the schema being shown, for its $refs. */
  function renderJson(pre, doc, base) {
    const text = JSON.stringify(doc, null, 2);
    const re = /"(?:[^"\\]|\\.)*"(\s*:)?|-?\d+(?:\.\d+)?(?:e[+-]?\d+)?|true|false|null/g;
    let last = 0;
    for (const m of text.matchAll(re)) {
      if (m.index > last) pre.appendChild(document.createTextNode(text.slice(last, m.index)));
      const tok = m[0];
      if (tok.startsWith('"')) {
        if (m[1]) pre.appendChild(el('span', 'k', tok));
        else {
          const raw = JSON.parse(tok);
          const href = typeof raw === 'string' ? hrefOf(raw, base) : null;
          if (href) { const a = el('a', null, tok); a.href = href; pre.appendChild(a); }
          else pre.appendChild(el('span', 's', tok));
        }
      } else pre.appendChild(el('span', 'n', tok));
      last = m.index + tok.length;
    }
    if (last < text.length) pre.appendChild(document.createTextNode(text.slice(last)));
  }

  // ---- schema pages -----------------------------------------------------------------------------------
  /** A schema shown as itself: its title and description, where it is published, and the JSON with every $ref linked. */
  function renderSchemaPage(main, v) {
    const page = el('div', 'page source');

  }

  // ---- document pages ---------------------------------------------------------------------------------
  /** The document a type reference names, canonical, or null: "@shapes/Customer.shape.json[]" → the Customer shape. */
  const shapeOf = (t) => { if (typeof t !== 'string') return null; const base = t.replace(/(\[\])+$/, ''); return base.startsWith('@') && isDocPath(base) ? canon(base) : null; };
  /** A type shown as an element with its shape linked; plain text when it names none. */
  const typeLink = (t, cls) => { const s = el('span', cls || 'type'); const shape = shapeOf(t); if (shape) { s.appendChild(link(shape)); const m = /((?:\[\])+)$/.exec(t); if (m) s.appendChild(document.createTextNode(m[1])); } else s.textContent = showType(t); return s; };
  /** A type as an element: a shape path becomes a link, an inline object is spelled out. */
  function typeEl(t) {
    if (t == null) return el('span', 'type', '');

      const m = /^(.*?)((?:\[\])*)$/.exec(t); const base = m[1], suffix = m[2];

    out.appendChild(document.createTextNode(' }'));
    return out;
  }

  /** A table of fields: name with the required mark, type, constraints, meaning. */

  /** A table of written values: setting → value, with document paths linked and templates shown as reads. */

  }
  function valueEl(v) {
    if (typeof v === 'string') {
      const base = v.split('#')[0].replace(/(\[\])+$/, '');
      if (v.startsWith('@') && isDocPath(base)) return frag(link(base, v.includes('#') ? showOp(v) : showType(v)));
      const m = /^\{\{\s*([^}]+?)\s*\}\}$/.exec(v); if (m) return frag(el('span', 'from', FROM + m[1]));
      return frag(JSON.stringify(v));
    }

  const chips = (paths, text) => { const d = el('div'); for (const p of paths || []) { const base = p.split('#')[0]; const c = link(base, null, 'chip'); c.textContent = ''; const kind = docAt(base) && docAt(base).kind; if (kind) c.appendChild(badge(kind)); c.appendChild(document.createTextNode(text ? text(p) : labelFor(base))); d.appendChild(c); } if (!(paths || []).length) d.appendChild(el('p', null, 'none')); return d; };

  /**
   * The access form of an invariant: what must gate every way in, the operations it covers, and -- the thing the
   * document cannot say about itself -- every trigger that reaches one, the operation it reaches it through, and
   * the policy that satisfies the rule there. A row with nothing in the last column is what the checker refuses

   */
  function renderAccessInvariant(page, inv) {
    const chain = el('div', 'chain');

    chain.appendChild(arrow());

      const t = el('table'); const hd = el('tr'); for (const h of ['trigger', 'reaches', 'through', 'satisfied by']) hd.appendChild(el('th', null, h)); t.appendChild(hd);

        tr.appendChild(by); t.appendChild(tr);

    }
  }

  /** The field form: the shape every value of which must satisfy the rule, the rule as written, and the fields its roots may name. */
  function renderHoldsInvariant(page, inv) {
    const chain = el('div', 'chain'); chain.appendChild(step('holds over every value of', link(inv.on, inv.onLabel))); page.appendChild(chain);
    page.appendChild(el('h2', null, 'The rule'));

  /**

   * value passed through -- and costs the graph nothing; a guarded one carries a switch the author never wrote
   * and hands its triggers the reason `invariant` to map. This is the whole return on stating the rule once.

  function renderSites(page, sites) {

    const lead = el('p');

    lead.appendChild(el('code', null, 'invariant'));

    for (const one of sites) t.appendChild(siteRow(one));

  /** One site as a row: the graph, the read path it answers at, how the value arrives, and how the rule stands. */

  }

  /**

  function renderDocPage(page, v) {
    const h1 = el('h1', null, v.label); h1.appendChild(schemaBadge(v.kind, null, v.kind + '.schema.json')); if (v.kind === 'shape') h1.appendChild(badge(v.kind, v.doc.layer === 'edge' ? 'edge: the world’s shape' : 'core: ours')); page.appendChild(h1);

    const d = v.doc;
    switch (v.kind) {

      marks.push({ text, cls: 'try', title: attemptsText(n) + '\na refusal is never tried again', chars: text.length + 2, px: text.length * 6 + 8 });
    }
    return marks;
  }
  const subOf = (n) => {
    if (n.kind === 'rule') return '';
    if (n.kind === 'in' || n.kind === 'out') return showType(n.type);
    if (n.kind === 'const') return 'typed literals';
    if (n.kind === 'request') return 'what the trigger kind hands';
    const op = n.target ? n.target.portLabel + SEP + n.target.opName : showOp(n.op);
    return (n.kind === 'map' ? 'for each: ' : '') + op;
  };

  /**
   * What a node's invariant badge says, and where a double-click on it lands. A guarded node names the
   * invariants it is guarded by, since the rule it could not prove is the thing a reader came for; a proved node
   * says only how, since which invariant is a rule that costs the graph nothing. Both open the invariant.
   */
  function badgeSaid(n) {
    if (n.guarded) {
      const names = n.guarded.by.map(one => one.label);
      const each = n.guarded.arity === 'list' ? ' Every element of the list is judged.' : '';
      return {
        cls: 'guard', text: 'guarded: ' + names.join('; '), open: n.guarded.by[0].path,
        hint: 'the compiler could not prove ' + names.join('; ') + ' here, so it guards this value:\n' + n.guarded.when + '\n\nthe graph refuses with the reason `invariant` where the rule does not hold.' + each + '\ndouble-click to open the invariant',
      };
    }
    const by = n.proved.by;
    const ways = heldWays(by.flatMap(one => one.held));
    return {
      cls: 'held', text: 'proved: ' + ways, open: by[0].path,
      hint: by.map(one => one.label + ': ' + one.when + '\n  held ' + heldWays(one.held)).join('\n') + '\n\nproved here, so nothing is lowered and no trigger maps `invariant` for it.\ndouble-click to open the invariant',
    };
  }

  /** The strip along a node's foot: the field invariant it is held to, and where a double-click on it opens. */
  function badgeEl(n, b) {
    const said = badgeSaid(n);
    const gb = svg('g', { transform: 'translate(10,' + (b.h - BADGE - 1) + ')' }, 'inv ' + said.cls);
    gb.appendChild(svg('rect', { width: b.w - 20, height: BADGE - 4 }, 'plate'));
    gb.appendChild(txt(6, 10, trunc(said.text, 42)));
    withTitle(gb, said.hint);
    gb.addEventListener('dblclick', ev => { ev.stopPropagation(); go(canon(said.open)); });
    return gb;
  }

  function drawGraph(main, g) {
    main.textContent = '';
    const colors = nodeColors(g);
    const root = svg('svg', {}, 'canvas');
    const defs = svg('defs');
    const pat = svg('pattern', { id: 'dots', width: 24, height: 24, patternUnits: 'userSpaceOnUse' }); pat.appendChild(svg('circle', { cx: 1, cy: 1, r: 1, fill: '#242c37' })); defs.appendChild(pat);
    root.appendChild(defs);
    root.appendChild(svg('rect', { width: '100%', height: '100%' }, 'grid'));
    const world = svg('g'); root.appendChild(world);
    const { boxes, groups, width, height } = layout(g);
    const byId = new Map(g.nodes.map(n => [n.id, n]));
    const rowY = (n, b, i) => b.y + headOf(n) + Math.max(0, i) * ROW + ROW / 2;
    const inY = (id, port) => { const n = byId.get(id); return rowY(n, boxes.get(id), n.inputs.findIndex(p => p.name === port)); };
    const outY = (id, port) => { const n = byId.get(id); return rowY(n, boxes.get(id), n.outputs.findIndex(p => p.name === port)); };
    const usedIn = new Set(g.edges.filter(e => e.kind === 'data').map(e => e.to + ' ' + e.toPort));

    const groupsG = svg('g'); world.appendChild(groupsG);
    for (const grp of groups) {
      const gg = svg('g', { transform: `translate(${grp.x},${grp.y})` }, 'group');
      gg.appendChild(svg('rect', { width: grp.w, height: grp.h }, 'box'));
      gg.appendChild(withTitle(txt(12, 21, trunc(grp.label, 30), 'title'), grp.label + (grp.description ? '\n' + grp.description : '')));
      gg.appendChild(txt(grp.w - 12, 21, 'decision', 'tag', { 'text-anchor': 'end' }));
      groupsG.appendChild(gg);
    }
    const edgesG = svg('g'); world.appendChild(edgesG);
    const edgeEls = [];
    /** Light an input up from the name in a rule's sentence: its pin, its label, and the wire that feeds it; off again on leave. */
    const light = (gn, n, input, on) => {
      for (const x of gn.querySelectorAll('[data-in]')) x.classList.toggle('lit-up', on && x.dataset.in === input);
      for (const p of edgeEls) { if (p.dataset.from !== n.id && p.dataset.to !== n.id) continue; const mine = p.dataset.to === n.id && p.dataset.toPort === input; p.classList.toggle('hot', on ? mine : true); p.classList.toggle('dim', on ? !mine : false); }
    };
    /** One line of a rule said in words: the joining word dim, values as literals, each input a name that lights its port up when hovered. */
    const saidLine = (gn, n, line, x, y) => {
      const t = svg('text', { x, y }, 'said');
      let room = 38;
      const add = (str, cls, input) => {
        if (room <= 0) return;
        const sp = svg('tspan', {}, cls); sp.textContent = str.length > room ? str.slice(0, Math.max(0, room - 1)) + ELLIPSIS : str; room -= str.length;
        if (input) { sp.dataset.in = input; sp.addEventListener('mouseenter', () => light(gn, n, input, true)); sp.addEventListener('mouseleave', () => light(gn, n, input, false)); }
        t.appendChild(sp);
      };
      add(line.lead + ' ', 'lead');
      for (const p of line.parts) { if ('input' in p) add(p.text, 'in', p.input); else if ('value' in p) add(p.value, 'val'); else add(p.text, 'word'); }
      return withTitle(t, n.label + '\n' + n.decision.when);
    };
    for (const e of g.edges) {
      const a = boxes.get(e.from), b = boxes.get(e.to); if (!a || !b) continue;
      if (isStep(byId, e)) {
        // otherwise, down to the next rule: a short step between two rungs of the ladder
        const x = a.x + a.w / 2, color = colors.get(e.to);
        const p = svg('path', { d: `M${x},${a.y + a.h} L${x},${b.y}`, stroke: color }, 'edge route step');
        p.dataset.from = e.from; p.dataset.to = e.to; edgesG.appendChild(p); edgeEls.push(p);
        edgesG.appendChild(txt(x + 8, (a.y + a.h + b.y) / 2 + 3.5, 'otherwise', 'elabel step'));
        continue;
      }
      const x1 = a.x + a.w, y1 = outY(e.from, e.fromPort);
      const toHead = e.kind === 'route' || e.toPort === '';
      const x2 = b.x, y2 = toHead ? b.y + headOf(byId.get(e.to)) / 2 : inY(e.to, e.toPort);
      const dx = Math.max(40, Math.abs(x2 - x1) / 2);
      const color = colors.get(e.to);
      const p = svg('path', { d: `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`, stroke: color }, 'edge ' + e.kind);
      p.dataset.from = e.from; p.dataset.to = e.to; p.dataset.toPort = e.toPort; edgesG.appendChild(p); edgeEls.push(p);
      // labels sit a third of the way along, where the curve is still near its source and clear of the target box
      if (e.label) edgesG.appendChild(withTitle(txt(x1 + (x2 - x1) * 0.33, y1 + (y2 - y1) * 0.18 - 5, trunc(e.label, 28), 'elabel', { 'text-anchor': 'middle', fill: color }), e.label));
    }
    for (const n of g.nodes) {
      const b = boxes.get(n.id), color = colors.get(n.id);
      const gn = svg('g', { transform: `translate(${b.x},${b.y})` }, 'node kind-' + n.kind + (n.participates ? ' joins' : '') + (state.selected === n.id ? ' selected' : '')); gn.dataset.id = n.id;
      gn.appendChild(svg('rect', { width: b.w, height: b.h }, 'box'));
      gn.appendChild(svg('rect', { width: b.w, height: headOf(n) }, 'head'));
      gn.appendChild(svg('rect', { x: 0, y: 8, width: 4, height: b.h - 16, rx: 2, fill: color }));
      if (n.kind === 'rule') n.says.forEach((line, i) => gn.appendChild(saidLine(gn, n, line, 14, 16 + i * 15)));
      else gn.appendChild(withTitle(txt(14, 17, trunc(n.label, 30), 'title'), n.label + (n.description ? '\n' + n.description : '')));
      const sub = subOf(n);
      // the marks share the sub's row from the right: the sub gives up the room each one takes
      const marks = marksOf(n);
      if (sub) gn.appendChild(opens(withTitle(txt(14, 32, trunc(sub, 36 - marks.reduce((sum, m) => sum + m.chars, 0)), 'sub'), n.op || n.type || sub), n.type ? shapeOf(n.type) : null));
      let right = b.w - 32;
      for (const m of marks) { gn.appendChild(withTitle(txt(right, 32, m.text, m.cls, { 'text-anchor': 'end' }), m.title)); right -= m.px; }
      if (n.guarded || n.proved) gn.appendChild(badgeEl(n, b));
      // a double-click on the request node opens the document behind its first read; a port opens its own
      const goto = n.target ? n.target.implementation : (n.outputs || []).map(p => p.opens).find(Boolean);
      if (goto) {
        const go_ = withTitle(txt(b.w - 20, 19, ARROW, 'go'), 'open ' + labelFor(goto));
        go_.addEventListener('click', ev => { ev.stopPropagation(); go(goto); });
        gn.appendChild(go_);
      }
      n.inputs.forEach((p, i) => {
        const y = headOf(n) + i * ROW + ROW / 2;
        const used = usedIn.has(n.id + ' ' + p.name);
        const req = p.required !== false;
        const pin = svg('circle', { cx: 0, cy: y, r: 3.8 }, 'pin' + (req ? ' req' : ''));
        if (used) { pin.setAttribute('stroke', color); if (req) pin.setAttribute('fill', color); }
        pin.dataset.in = p.name;
        gn.appendChild(pin);
        const val = p.literal != null ? ' = ' + showLit(p) : p.text != null ? ' = ' + p.text : p.bound != null ? ' ' + FROM + 'item' + (p.bound ? '.' + p.bound : '') : '';
        const nameLen = Math.min(14, p.name.length);
        const room = n.outputs.length ? 22 : 36; // characters the left column may use when the right one is in use
        const hint = p.name + (req ? '' : ' (optional)') + (p.type ? ': ' + showType(p.type) : '') + (p.description ? '\n' + p.description : '');
        const name = withTitle(txt(12, y + 4, trunc(p.name, 14), 'port' + (p.missing ? ' miss' : req ? '' : ' opt')), hint); name.dataset.in = p.name; gn.appendChild(name);
        if (val) gn.appendChild(opens(withTitle(txt(12 + (nameLen + 1) * CH, y + 4, trunc(val, room - nameLen), 'port lit'), p.name + val), p.ref));
        else if (p.missing) gn.appendChild(txt(12 + (nameLen + 1) * CH, y + 4, 'not given', 'port miss'));
        else if (p.type && n.outputs.length === 0) gn.appendChild(opens(withTitle(txt(12 + (nameLen + 1) * CH, y + 4, trunc(showType(p.type), room - 1 - nameLen), 'port type'), p.name + ': ' + showType(p.type)), shapeOf(p.type)));
      });
      const usedOut = new Set(g.edges.filter(e => e.from === n.id).map(e => e.fromPort));
      n.outputs.forEach((p, i) => {
        const y = headOf(n) + i * ROW + ROW / 2;
        if (n.kind === 'rule') {
          // then, and on the last rule otherwise: each names where it goes, in that node's colour; the wire says the same
          const target = colors.get(p.description) || color, to = labelOfNode(g, p.description), isElse = p.name === 'otherwise';
          gn.appendChild(svg('circle', { cx: b.w, cy: y, r: 3.8, stroke: target, fill: target }, 'pin req'));
          const t = txt(b.w - 12, y + 4, trunc(isElse ? 'otherwise' : to, n.inputs.length ? 14 : 30), 'port' + (isElse ? ' miss' : ''), { 'text-anchor': 'end', fill: target });
          gn.appendChild(withTitle(t, (isElse ? 'otherwise' : 'then') + TO + to));
          return;
        }
        const req = p.required !== false;
        const depth = p.depth || 0;
        const parentOnly = depth === 0 && !usedOut.has(p.name) && n.outputs.some(o => o.depth && o.name.startsWith(p.name + '.'));
        if (!parentOnly) {
          const pin = svg('circle', { cx: b.w, cy: y, r: 3.8 }, 'pin' + (req ? ' req' : ''));
          gn.appendChild(pin);
        }
        const leaf = p.name.split('.').pop();
        const label = p.name === '' ? (p.type ? showType(p.type) : 'the value') : (p.label || leaf);
        const hint = (p.label ? p.label + ': ' : '') + (n.kind === 'request' ? showRead('request.' + p.name) : (p.name || 'the whole value')) + (req ? '' : ' (optional)') + (p.type ? ': ' + showType(p.type) : '') + (p.description ? '\n' + p.description : '');
        const room = (n.inputs.length ? 14 : 30) - depth * 2;
        const t = txt(b.w - 12 - depth * 12, y + 4, trunc(label, room), 'port' + (p.name === '' ? ' type' : parentOnly ? ' type' : req ? '' : ' opt'), { 'text-anchor': 'end' });
        gn.appendChild(opens(withTitle(t, hint), p.opens || (p.name === '' ? shapeOf(p.type) : null)));
        if (depth) gn.appendChild(svg('path', { d: `M${b.w - 12 - depth * 12 - 4},${y - 6} v6 h-3`, stroke: 'var(--dim)', fill: 'none', 'stroke-width': 1 }));
      });
      (n.fields || []).forEach((p, i) => {
        const y = headOf(n) + i * ROW + ROW / 2;
        const req = p.required !== false;
        gn.appendChild(withTitle(txt(14, y + 4, trunc(p.name, 16), 'port' + (req ? '' : ' opt')), p.name + (req ? '' : ' (optional)') + ': ' + showType(p.type)));
        gn.appendChild(opens(withTitle(txt(b.w - 12, y + 4, trunc(showType(p.type), 18), 'port type', { 'text-anchor': 'end' }), showType(p.type)), shapeOf(p.type)));
      });
      gn.addEventListener('click', ev => { ev.stopPropagation(); state.selected = n.id; for (const x of world.querySelectorAll('.node')) x.classList.toggle('selected', x.dataset.id === n.id); renderDetails(); });
      gn.addEventListener('dblclick', ev => { ev.stopPropagation(); if (goto) go(goto); });
      gn.addEventListener('mouseenter', () => { for (const p of edgeEls) { const hot = p.dataset.from === n.id || p.dataset.to === n.id; p.classList.toggle('hot', hot); p.classList.toggle('dim', !hot); } });
      gn.addEventListener('mouseleave', () => { for (const p of edgeEls) { p.classList.remove('hot'); p.classList.remove('dim'); } });
      world.appendChild(gn);
    }
    // pan and zoom
    const apply = () => { const t = state.transform; world.setAttribute('transform', `translate(${t.x},${t.y}) scale(${t.k})`); };
    const fit = () => {
      const r = main.getBoundingClientRect();
      // never smaller than readable: a wide graph starts at its input and is panned, not shrunk into a strip
      const k = Math.min(1.25, Math.max(0.7, Math.min((r.width - 80) / Math.max(width, 1), (r.height - 100) / Math.max(height, 1))));
      state.transform = { k, x: width * k > r.width - 80 ? 40 : (r.width - width * k) / 2, y: (r.height - height * k) / 2 }; apply();
    };
    if (state.fit) { state.fit = false; fit(); } else apply();
    let drag = null;
    root.addEventListener('mousedown', ev => { if (ev.button !== 0) return; drag = { x: ev.clientX, y: ev.clientY, tx: state.transform.x, ty: state.transform.y }; root.classList.add('panning'); });
    root.addEventListener('mousemove', ev => { if (!drag) return; state.transform.x = drag.tx + ev.clientX - drag.x; state.transform.y = drag.ty + ev.clientY - drag.y; apply(); });
    root.addEventListener('mouseup', () => { drag = null; root.classList.remove('panning'); });
    root.addEventListener('mouseleave', () => { drag = null; root.classList.remove('panning'); });
    root.addEventListener('wheel', ev => {
      ev.preventDefault();
      const r = root.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
      const t = state.transform, k = Math.min(3, Math.max(0.15, t.k * Math.exp(-ev.deltaY * 0.0015)));
      t.x = mx - (mx - t.x) * (k / t.k); t.y = my - (my - t.y) * (k / t.k); t.k = k; apply();
    }, { passive: false });
    root.addEventListener('click', () => { if (state.selected !== null) { state.selected = null; for (const x of world.querySelectorAll('.node')) x.classList.remove('selected'); renderDetails(); } });
    main.appendChild(root);
    const bar = el('div', 'toolbar');
    const fitBtn = el('button', null, 'fit'); fitBtn.onclick = fit; bar.appendChild(fitBtn);
    const one = el('button', null, '100%'); one.onclick = () => { state.transform.k = 1; apply(); }; bar.appendChild(one);
    main.appendChild(bar);
    const legend = el('div', 'legend');
    const a = el('span'); a.appendChild(el('i', 'full')); a.appendChild(frag('required')); legend.appendChild(a);
    const b2 = el('span'); b2.appendChild(el('i')); b2.appendChild(frag('optional')); legend.appendChild(b2);
    const c = el('span'); c.appendChild(el('s')); c.appendChild(frag('a decision routes')); legend.appendChild(c);
    legend.appendChild(el('span', null, 'an edge has the colour of the node it feeds'));
    // the rim is only worth explaining where something wears it
    if (g.atomic) { const t = el('span'); t.appendChild(el('u')); t.appendChild(frag('a rimmed node is in the transaction')); legend.appendChild(t); }
    if (g.nodes.some(n => n.retry || n.timeoutMs !== undefined)) legend.appendChild(el('span', null, '\u21bbn is tried again n more times, \u2264 bounds how long one call may take'));
    if (g.nodes.some(n => n.guarded || n.proved)) legend.appendChild(el('span', null, 'a badge is a field invariant: named where it is guarded, lighter where it is proved \u2014 double-click to open it'));
    legend.appendChild(el('span', null, ARROW + ' or double-click opens the implementation'));
    main.appendChild(legend);
  }

  // ---- start ------------------------------------------------------------------------------------------
  (async () => {
    STATIC = await fetch('index.json', { cache: 'no-store' }).then(r => r.ok).catch(() => false);
    await refresh(true); await route();
    if (!STATIC) watch();
  })();
})();
</script>
</body>
</html>
