{{- /*
The Secret every variable is read from, made by the chart only where the operator asks with secret.create. Otherwise
the operator creates it, the chart holds no value, and NOTES.txt says how. A variable the PostgreSQL cluster answers
is read from the cluster's own Secret, so it is not asked for here.
*/ -}}
{{- if .Values.secret.create }}
{{- $wired := include "wilanis-tree.wired" . | fromJsonArray }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wilanis-tree.secret" . }}
  labels:
    app.kubernetes.io/name: {{ include "wilanis-tree.name" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
type: Opaque
stringData:
  {{- range $key := .Values.secret.keys }}
  {{- if not (has $key $wired) }}
  {{ $key }}: {{ required (printf "secret.values.%s is required: secret.create makes the Secret from secret.values, one value per key a workload reads" $key) (index ($.Values.secret.values | default dict) $key) | quote }}
  {{- end }}
  {{- end }}
{{- end }}
